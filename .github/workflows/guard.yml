name: Guard

on:
  pull_request:
    # 既定は opened / synchronize / reopened のみ。
    # labeled / unlabeled: allow-protected-change の付け外しで再判定させる。
    #   そうしないと後から付けても再実行されず、外しても成功済みのチェックが残る。
    # edited: base ブランチの付け替えは edited として飛ぶ。付け替えると差分が変わる。
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base との差分を取るため、全履歴が要る
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check protected paths
        env:
          # ${{ }} を run: へ直接展開しない（コマンドインジェクション対策）
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # 実行するのは必ず base リビジョンの版にする。候補側を実行すると、
          # チェッカーを無害化する変更と保護パスの変更を同じ PR に入れるだけで
          # ガードを回避できる。
          # Core 抽出後は sibling import があるので、単一ファイルコピーではなく
          # base の loop-core/ 一式を展開して CLI 経由で実行する。
          BASE="origin/$BASE_REF"
          if git cat-file -e "$BASE:loop-core/bin/loop.mjs" 2>/dev/null; then
            git archive "$BASE" loop-core | tar -x -C "$RUNNER_TEMP"
            echo "base（$BASE）の loop-core CLI で判定します。"
            node "$RUNNER_TEMP/loop-core/bin/loop.mjs" check-protected-paths "$BASE"
          elif git cat-file -e "$BASE:tools/check-protected-paths.mjs" 2>/dev/null; then
            CHECKER="$RUNNER_TEMP/check-protected-paths.mjs"
            git show "$BASE:tools/check-protected-paths.mjs" > "$CHECKER"
            echo "base（$BASE）の単一ファイルチェッカーで判定します（loop-core 導入前）。"
            node "$CHECKER" "$BASE"
          else
            echo "::warning::base にチェッカーが無いため候補側で判定します（ガード導入 PR のみ想定）。"
            if [ -f loop-core/bin/loop.mjs ]; then
              node loop-core/bin/loop.mjs check-protected-paths "$BASE"
            elif [ -f tools/check-protected-paths.mjs ]; then
              node tools/check-protected-paths.mjs "$BASE"
            else
              echo "候補側にもチェッカーがありません。"
              exit 1
            fi
          fi

  progress-coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base との差分を取るため、全履歴が要る
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check progress coupling
        env:
          # ${{ }} を run: へ直接展開しない（コマンドインジェクション対策）
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # 進捗の **Branch** と照合する head ブランチ。pull_request では必ず入る。
          # GITHUB_HEAD_REF は既定でも入るが、依存を見えるように明示する。
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # protected-paths と同じ理由で、実行するのは必ず base リビジョンの版にする。
          BASE="origin/$BASE_REF"
          if git cat-file -e "$BASE:loop-core/bin/loop.mjs" 2>/dev/null; then
            git archive "$BASE" loop-core | tar -x -C "$RUNNER_TEMP"
            echo "base（$BASE）の loop-core CLI で判定します。"
            node "$RUNNER_TEMP/loop-core/bin/loop.mjs" check-progress-coupling "$BASE"
          elif git cat-file -e "$BASE:tools/check-progress-coupling.mjs" 2>/dev/null; then
            CHECKER="$RUNNER_TEMP/check-progress-coupling.mjs"
            git show "$BASE:tools/check-progress-coupling.mjs" > "$CHECKER"
            echo "base（$BASE）の単一ファイルチェッカーで判定します（loop-core 導入前）。"
            node "$CHECKER" "$BASE"
          else
            echo "::warning::base にチェッカーが無いため候補側で判定します（導入 PR のみ想定）。"
            if [ -f loop-core/bin/loop.mjs ]; then
              node loop-core/bin/loop.mjs check-progress-coupling "$BASE"
            elif [ -f tools/check-progress-coupling.mjs ]; then
              node tools/check-progress-coupling.mjs "$BASE"
            else
              echo "候補側にもチェッカーがありません。"
              exit 1
            fi
          fi
