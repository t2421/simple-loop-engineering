# PR ごとに計算 UI のプレビュー URL を Cloudflare Pages で発行する（0013-cloudflare-preview）。
#
# ここは **必須チェックにしない**。CLAUDE.md の検証（`npm run ci`）と各ゲートは
# ローカル完結のままにし、外部サービスと Secrets の可用性にマージ可能性を縛らない。
# その代わり、発行できなかったときに **黙って緑にしない**。理由を出して赤くする。
#
# `src/` はビルド不要の静的ファイル（calc.html・calc.css・calc.mjs・math.mjs・assets/）
# なので、そのまま direct upload する。

name: preview

on:
  pull_request:

# 同じ PR に続けて push したとき、古いデプロイとコメント更新が競らないようにする
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # sticky コメントの投稿・更新に要る
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check preconditions
        env:
          # ${{ }} を run: へ直接展開しない（コマンドインジェクション対策。ci.yml と同じ作法）
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          # Secrets は「有無」だけを見る。値は表示も比較もしない
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "fork からの PR ではプレビューを発行しません。"
            echo "このリポジトリは public で、fork PR に Secrets は渡りません。渡すには"
            echo "pull_request_target が要りますが、未検証コードに認証情報を晒す既知の"
            echo "危険パターンなので、意図的に対象外にしています（spec の「背景」を見よ）。"
            exit 1
          fi
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "Cloudflare の Secrets が未登録のため、プレビューを発行できません。"
            echo "デプロイは試みていません。次を登録してください（値はログに出しません）:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID"
            echo "このジョブは必須チェックではないので、マージ可能性は変わりません。"
            echo "それでも成功にはしません。発行できていないことを緑で隠さないためです。"
            exit 1
          fi
          echo "preconditions ok"

      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          # wrangler は CI でしか使わないので package.json の依存には入れない。
          # メジャーは固定する（`npx wrangler` のまま置くと、ある日メジャーが上がって壊れる）。
          npx --yes wrangler@4 pages deploy src \
            --project-name=simple-loop-engineering \
            --branch="pr-${PR_NUMBER}" \
            --commit-dirty=true 2>&1 | tee deploy.log

          # wrangler はデプロイ先 URL を標準出力に出す。最後に現れたものを採る。
          # grep はマッチが無いと exit 1 を返す。pipefail 下でそのまま tail に渡すと
          # 代入全体が非 0 になり、set -e で直後の空判定（診断メッセージ）に届かず
          # 落ちてしまう（レビューで指摘された Low。実測で確認済み）。
          # `|| true` でマッチ無しを「空文字列」として素通りさせ、判定は次の [ -z ] に委ねる。
          URL="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then
            echo "デプロイ出力から URL を取り出せませんでした。"
            echo "URL が分からなければプレビューを発行した意味がないので、失敗として扱います。"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "preview: $URL"

      - name: Verify deployed content
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          # wrangler の成功報告や URL の印字だけでは、配信物が空でも
          # Pages プロジェクトのルート設定が src/ 以外でも気づけない
          # （0028 と同型の「緑が検証の証拠になっていない」パターン）。
          # ここで実際に /calc.html を取得し、src/calc.html と一致することまで確かめる。
          # Pages の伝播待ちがあるのでリトライは必須。
          #
          # `-L` でリダイレクトを追う。Pages は既定で /calc.html を /calc へ 308 で
          # 導く（0032 で実測）。`-f` は 3xx をエラーにしないため、`-L` が無いと
          # exit 0 のまま空ファイルを書き、後段の diff が必ず落ちる。
          # 追った先が 200 でないことを見逃さないよう、HTTP コードも明示的に検査する。
          #
          # curl 自身の終了ステータスも要求する（0032 のレビューで出た指摘）。
          # `|| true` で握り潰すと、HTTP 200 が返り本文も完全なのに curl が
          # CURLE_PARTIAL_FILE 等で非 0 終了する場合に転送失敗を見逃す。
          # 0 かつ 200 の両方を満たしたときだけ次へ進む。
          set +e
          HTTP_CODE="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              -o downloaded-calc.html -w '%{http_code}' "$URL/calc.html")"
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            if [ "$CURL_STATUS" -ne 0 ]; then
              echo "デプロイ先 $URL/calc.html の取得に失敗しました（リトライ後も失敗）。"
              echo "curl の終了ステータス: $CURL_STATUS"
            fi
            if [ "$HTTP_CODE" != "200" ]; then
              echo "デプロイ先 $URL/calc.html が 200 を返しませんでした。"
              echo "リダイレクト追従後の HTTP コード: ${HTTP_CODE:-取得できず}"
            fi
            echo "配信物が存在しない、応答が無い、転送が途中で壊れた、または HTTP エラーの可能性があります。"
            exit 1
          fi

          if ! diff -u src/calc.html downloaded-calc.html; then
            echo "デプロイ先の /calc.html の内容が src/calc.html と一致しません（上の diff を参照）。"
            echo "配信物が空、または Pages プロジェクトのルート設定が src/ ではない可能性があります。"
            exit 1
          fi

          echo "検証 OK: $URL/calc.html はリダイレクト追従後に 200 を返し、src/calc.html と同一内容です。"

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 目印で自分のコメントを見つけ、1 件を更新する（push のたびに増やさない）
          MARKER='<!-- cloudflare-preview -->'
          BODY="$(printf '%s\n\n**プレビュー**: %s/calc.html\n\n- 対象コミット: `%s`\n- このチェックは必須ではありません（ローカルの `npm run ci` は Cloudflare に依存しません）\n' "$MARKER" "$URL" "$SHA")"

          ID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body != null and (.body | startswith(\"$MARKER\")))] | .[0].id // empty")"

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "既存のコメント($ID)を更新しました。"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
            echo "コメントを新規投稿しました。"
          fi
