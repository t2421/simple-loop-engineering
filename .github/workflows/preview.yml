# PR ごとに計算 UI のプレビュー URL を Cloudflare Pages で発行する（0013-cloudflare-preview）。
#
# ここは **必須チェックにしない**。CLAUDE.md の検証（`npm run ci`）と各ゲートは
# ローカル完結のままにし、外部サービスと Secrets の可用性にマージ可能性を縛らない。
# その代わり、発行できなかったときに **黙って緑にしない**。理由を出して赤くする。
#
# `src/` はビルド不要の静的ファイル（calc.html・calc.css・calc.mjs・math.mjs・assets/）
# なので、そのまま direct upload する。

name: preview

on:
  pull_request:

# 同じ PR に続けて push したとき、古いデプロイとコメント更新が競らないようにする
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # sticky コメントの投稿・更新に要る
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check preconditions
        env:
          # ${{ }} を run: へ直接展開しない（コマンドインジェクション対策。ci.yml と同じ作法）
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          # Secrets は「有無」だけを見る。値は表示も比較もしない
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "fork からの PR ではプレビューを発行しません。"
            echo "このリポジトリは public で、fork PR に Secrets は渡りません。渡すには"
            echo "pull_request_target が要りますが、未検証コードに認証情報を晒す既知の"
            echo "危険パターンなので、意図的に対象外にしています（spec の「背景」を見よ）。"
            exit 1
          fi
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "Cloudflare の Secrets が未登録のため、プレビューを発行できません。"
            echo "デプロイは試みていません。次を登録してください（値はログに出しません）:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID"
            echo "このジョブは必須チェックではないので、マージ可能性は変わりません。"
            echo "それでも成功にはしません。発行できていないことを緑で隠さないためです。"
            exit 1
          fi
          echo "preconditions ok"

      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          # wrangler は CI でしか使わないので package.json の依存には入れない。
          # メジャーは固定する（`npx wrangler` のまま置くと、ある日メジャーが上がって壊れる）。
          npx --yes wrangler@4 pages deploy src \
            --project-name=simple-loop-engineering \
            --branch="pr-${PR_NUMBER}" \
            --commit-dirty=true 2>&1 | tee deploy.log

          # wrangler はデプロイ先 URL を標準出力に出す。最後に現れたものを採る。
          URL="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)"
          if [ -z "$URL" ]; then
            echo "デプロイ出力から URL を取り出せませんでした。"
            echo "URL が分からなければプレビューを発行した意味がないので、失敗として扱います。"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "preview: $URL"

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 目印で自分のコメントを見つけ、1 件を更新する（push のたびに増やさない）
          MARKER='<!-- cloudflare-preview -->'
          BODY="$(printf '%s\n\n**プレビュー**: %s/calc.html\n\n- 対象コミット: `%s`\n- このチェックは必須ではありません（ローカルの `npm run ci` は Cloudflare に依存しません）\n' "$MARKER" "$URL" "$SHA")"

          ID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body != null and (.body | startswith(\"$MARKER\")))] | .[0].id // empty")"

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "既存のコメント($ID)を更新しました。"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
            echo "コメントを新規投稿しました。"
          fi
