<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<style>
  :root{
    --bg:#14181f;
    --fg:#e8e6e0;
    --line:#2e3745;
    --accent:#d98936;
  }
  body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;
       max-width:520px;margin:60px auto;padding:0 20px;}
  h1{font-size:20px;}
  form{display:flex;gap:8px;margin-bottom:20px;}
  input{flex:1;padding:9px 12px;background:#0f1319;color:var(--fg);
        border:1px solid var(--line);border-radius:2px;}
  button{background:var(--accent);color:#14181f;border:none;padding:9px 16px;
         border-radius:2px;cursor:pointer;font-weight:600;}
  ul{list-style:none;padding:0;}
  li{display:flex;align-items:center;gap:10px;padding:10px 0;
     border-bottom:1px solid var(--line);}
  .text{flex:1;}
  li[data-done="true"] .text{opacity:.5;text-decoration:line-through;}
  .toggle{width:20px;height:20px;border:1px solid #4fa8a0;border-radius:50%;
          cursor:pointer;flex:none;}
  .toggle[data-on="true"]{background:#4fa8a0;}
  .del{color:#888888;cursor:pointer;font-size:13px;}
</style>
</head>
<body>
  <h1>Todo</h1>
  <form id="f">
    <input id="i" placeholder="タスクを入力" autocomplete="off">
    <button type="submit">追加</button>
  </form>
  <ul id="list"></ul>

<script type="module">
  import { add, toggle, remove, activeCount } from "./todo.mjs";

  let state = [];
  const list = document.getElementById("list");

  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("i");
    if (!input.value.trim()) return;
    state = add(state, input.value.trim());
    input.value = "";
    render();
  });

  function render() {
    list.innerHTML = "";
    for (const t of state) {
      const li = document.createElement("li");
      li.dataset.done = t.done;

      const tg = document.createElement("div");
      tg.className = "toggle";
      tg.dataset.on = t.done;
      tg.onclick = () => { state = toggle(state, t.id); render(); };

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = t.text;

      const del = document.createElement("div");
      del.className = "del";
      del.textContent = "削除";
      del.onclick = () => { state = remove(state, t.id); render(); };

      li.append(tg, span, del);
      list.appendChild(li);
    }
  }

  render();
</script>
</body>
</html>
